[package]
name = "gridline-core"
version = "0.1.0"
edition = "2024"
description = "From-scratch OOXML workbook layout engine for WebAssembly"
license = "MIT"
repository = "https://github.com/Creative-Strategies/Gridline"
homepage = "https://github.com/Creative-Strategies/Gridline"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = "0.1"
office-crypto = "0.3"
quick-xml = "0.38"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
thiserror = "2"
wasm-bindgen = "0.2"
zip = { version = "4", default-features = false, features = ["deflate"] }

[dev-dependencies]
pretty_assertions = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
